<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>恋愛シミュレーションゲーム 〜キャンパス編〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f6fc; --grid:#dde5f4; --ink:#1e3170; --ink-soft:#56648f;
  --marker:#ff5fa8; --marker-soft:#ffd3e6; --note:#ffe47d; --card:#ffffff; --line:#c8d3ea;
  --good:#2f9e6a; --bad:#d8485a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#182039; --grid:#222c4b; --ink:#e4eaff; --ink-soft:#a1acd4;
    --marker:#ff7ab6; --marker-soft:#4b2745; --note:#6e5c1c; --card:#1f2847; --line:#35416b;
    --good:#5fd49b; --bad:#ff7c8b;
  }
}
:root[data-theme="dark"]{
  --paper:#182039; --grid:#222c4b; --ink:#e4eaff; --ink-soft:#a1acd4;
  --marker:#ff7ab6; --marker-soft:#4b2745; --note:#6e5c1c; --card:#1f2847; --line:#35416b;
  --good:#5fd49b; --bad:#ff7c8b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.8; min-height:100vh;
}
.hand{font-family:"Yomogi","Zen Maru Gothic","Hiragino Maru Gothic ProN",cursive}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-20px -16px 18px;padding:10px 16px;flex-wrap:nowrap;position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
.date{white-space:nowrap;flex:none}
.logo{font-size:1.6rem;margin:0;line-height:1.2}
.logo small{display:block;font-size:.85rem;color:var(--ink-soft);font-family:"Zen Maru Gothic",sans-serif}
.logo{min-width:0}
@media (max-width:600px){.logo{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logo small{font-size:.72rem}.date{font-size:1rem;padding:4px 10px}}
.date{background:var(--note);color:var(--ink);padding:6px 14px;transform:rotate(-2deg);font-size:1.15rem;box-shadow:2px 3px 0 var(--line)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
@media (max-width:780px){.layout{grid-template-columns:1fr}}
.page{background:var(--card);border:2px solid var(--ink);border-radius:4px 18px 4px 18px;padding:24px 22px;position:relative}
.page h2{font-size:1.7rem;margin:0 0 8px;line-height:1.3}
.page p{margin:0 0 12px;max-width:40em}
.speaker{display:flex;gap:14px;align-items:center;margin:14px 0 16px}
.ava{flex:none;width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--ink);background:var(--paper)}
.ava.sm{width:42px;height:42px}
.pic{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:8px;border:2px solid var(--ink)}
.type{display:inline-block;background:var(--note);padding:0 8px;font-size:.8rem;margin-top:8px;border-radius:4px}
.quote{font-size:1.2rem}
.choices{display:grid;gap:10px;margin-top:18px}
.choice{
  font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  background:transparent;border:2px dashed var(--line);border-radius:10px;padding:12px 16px;
  transition:background-color .15s,border-color .15s;
}
.choice:hover{background:linear-gradient(transparent 55%,var(--marker-soft) 55%);border-color:var(--marker)}
.choice:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--marker);color:#fff;border-radius:999px;padding:10px 22px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 14px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
label.f{display:block;margin:14px 0 6px;font-weight:700}
input[type=text],select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;width:100%;max-width:340px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:2px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.seg input:checked+label{border-color:var(--ink);background:var(--marker-soft)}
.seg input:focus-visible+label{outline:3px solid var(--marker)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:14px}
.cand{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px}
.cand:hover{border-color:var(--marker)}
.cand .pic{margin-bottom:0}
.cand .meter{width:100%}
.cand .nm{font-weight:700;font-size:1.1rem;margin-top:2px}
.cand .dp{font-size:.85rem;color:var(--ink-soft)}
.cand .ds{font-size:.9rem;margin-top:6px;line-height:1.6}
aside .note{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:16px}
aside h3{margin:0 0 10px;font-size:1.25rem}
.who{display:flex;gap:10px;align-items:center}
.status{display:inline-block;font-size:.8rem;border:1.5px solid var(--ink);border-radius:999px;padding:0 10px;margin-top:2px}
.status.lover{background:var(--marker);color:#fff;border-color:var(--marker)}
.meter{width:100%;font-size:.8rem}
.meter .mtop{display:flex;justify-content:space-between;gap:8px}
.meter .mlab{color:var(--ink-soft)}
.meter .bar{position:relative;height:10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;margin-top:2px}
.meter .fill{height:100%;background:linear-gradient(90deg,#ffb3d4,var(--marker));border-radius:999px;transition:width .6s ease}
.meter .bar i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.meter .bar i.cl{width:2px;background:var(--ink);opacity:.5}
.meter.big{font-size:.95rem}
.meter.big .bar{height:16px}
.meter .ticks{position:relative;height:18px;font-size:.7rem;color:var(--ink-soft)}
.meter .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{font-size:.75rem;color:var(--ink-soft);margin-top:4px}
.meter.rival .fill{background:linear-gradient(90deg,#b7c3dd,#56648f)}
.money{font-size:.95rem;margin-bottom:6px}
.sbar{display:grid;grid-template-columns:4.5em 1fr 3.5em;align-items:center;gap:8px;font-size:.82rem;margin-top:4px}
.sbar .bar{height:8px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.sbar .fill{height:100%;background:var(--note)}
.sbar .sv{text-align:right;white-space:nowrap}
.grp{font-weight:700;margin:18px 0 8px}
.grp .hint{font-weight:400;font-size:.8rem;color:var(--ink-soft);margin-left:6px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.act{font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:transparent;border:2px dashed var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.act span{font-size:.8rem;color:var(--ink-soft)}
.act:hover:not(:disabled){background:linear-gradient(transparent 55%,var(--marker-soft) 55%);border-color:var(--marker)}
.act:disabled{opacity:.4;cursor:not-allowed}
.stars{color:#f0a500;letter-spacing:1px}.stars .off{color:var(--line)}.lvn{font-size:.75rem}
.ripple{font-size:.85rem;padding:6px 10px;border-radius:8px;background:var(--paper)}.ripple.down{color:var(--bad)}.ripple.up{color:var(--good)}
.ava.chihiro{display:grid;place-items:center;background:#7cc6c0;color:#fff;font-size:2rem}
.hintbox{background:var(--note);color:var(--ink);padding:10px 14px;border-radius:8px;max-width:36em}
.phone{max-width:360px;border:2px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--paper);margin:10px 0}
.phead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:1.5px solid var(--line)}
.pbody{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;font-size:.95rem;line-height:1.5}
.bub.l{align-self:flex-start;background:var(--card);border:1.5px solid var(--line);border-bottom-left-radius:4px}
.bub.r{align-self:flex-end;background:#7fd88f;color:#123;border-bottom-right-radius:4px}
.bub.note{align-self:center;background:transparent;color:var(--ink-soft);font-size:.8rem}
.modal{position:fixed;inset:0;background:rgba(20,28,60,.45);display:grid;place-items:center;padding:20px;z-index:10}
.mbox{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;max-width:380px;width:100%}
.mbox p{margin:0}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;font-size:.92rem}
.plist li.cur{font-weight:700}
.delta{font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.log{max-height:260px;overflow:auto;font-size:.85rem;color:var(--ink-soft);padding-left:18px;margin:8px 0 0}
details summary{cursor:pointer;font-weight:700}
.stamp{position:absolute;top:-14px;right:18px;background:var(--marker);color:#fff;padding:2px 12px;transform:rotate(3deg);font-size:1rem}
.big{font-size:2rem;margin:6px 0 10px;line-height:1.3}
@media (prefers-reduced-motion:no-preference){ .page.enter{animation:pop .25s ease-out} @keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}} }
/* ---------- 卒業の振り返り ---------- */
.recap{margin-top:18px;border-top:2px dashed var(--line);padding-top:16px}
.recap h3{font-size:1.4rem;margin:0 0 10px}
.badge{display:inline-block;background:var(--marker);color:#fff;padding:4px 16px;border-radius:999px;font-size:1.2rem;transform:rotate(-2deg);margin:4px 0 6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.rcell{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.rcell .rk{font-size:.8rem;color:var(--ink-soft)}
.rcell .rv{font-size:1.5rem;font-weight:700;line-height:1.3}
.rcell .rs{font-size:.75rem;color:var(--ink-soft)}
.rlovers{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.rlovers span{display:flex;align-items:center;gap:6px;font-size:.9rem}
/* ---------- タイトル画面 ---------- */
.title-screen{text-align:center;padding:36px 22px 32px}
.title-screen .tt-sub{color:var(--ink-soft);margin:0 0 4px;font-size:1rem}
.title-screen .tt-main{font-size:clamp(1.8rem,8vw,3rem);margin:0;line-height:1.35}
.title-screen .tt-main span{display:inline-block;background:linear-gradient(transparent 60%,var(--marker-soft) 60%);padding:0 .15em}
body.on-title header.top{display:none}
.title-screen .tt-ed{display:inline-block;background:var(--note);padding:2px 16px;transform:rotate(-2deg);font-size:1.3rem;margin:12px 0 4px;box-shadow:2px 3px 0 var(--line)}
.title-screen .tt-faces{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:22px auto 6px;max-width:520px}
.title-screen .tt-faces img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--ink);background:var(--paper)}
.title-screen p.tt-lead{margin:14px auto 0;max-width:30em}
.title-screen .row{justify-content:center;margin-top:24px}
.title-screen .btn{font-size:1.15rem;padding:12px 36px}
@media (prefers-reduced-motion:no-preference){ .title-screen .tt-start{animation:pulse 1.8s ease-in-out infinite} @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}} }
</style>
</head>
<body>

  <header class="top">
    <h1 class="logo hand">恋愛シミュレーションゲーム<small>キャンパス編</small></h1>
    <div id="date" class="date hand" hidden></div>
  </header>
  <div id="app"></div>
</div>

function fresh(key,arr){if(!S.recent)S.recent={};const h=S.recent[key]||[];const m=Math.min(arr.length-1,Math.ceil(arr.length*.6));let idx=arr.map((_,i)=>i).filter(i=>!h.slice(-m).includes(i));if(!idx.length)idx=arr.map((_,i)=>i);const i=pick(idx);h.push(i);S.recent[key]=h.slice(-Math.max(m,1));return arr[i]}
const L=(c,k)=>fresh(c.id+':'+k,c[k]);
const NN=k=>fresh('n:'+k,N[k]);
function freshScene(key,pool){if(!S.recent)S.recent={};const h=S.recent[key]||[];const m=Math.min(pool.length-1,Math.ceil(pool.length*.6));let c=pool.filter(s=>!h.slice(-m).includes(s.id));if(!c.length)c=pool;const s=pick(c);h.push(s.id);S.recent[key]=h.slice(-m);return s}
const yen=n=>'¥'+n.toLocaleString('ja-JP');

function meter(a,big,delta){const v=Math.round(a);
return `<div class="meter${big?' big':''}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-label="好感度">
<div class="mtop"><span>好感度 <b>${v}</b>/100</span>${delta!=null?`<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}</span>`:''}</div>
<div class="bar"><div class="fill" style="width:${v}%"></div><i style="left:20%"></i><i style="left:45%"></i><i class="cl" style="left:40%" title="告白できるライン"></i><i style="left:70%"></i></div>
${big?'<div class="ticks"><span style="left:20%">友達</span><span style="left:45%">仲良し</span><span style="left:70%">いい感じ</span></div>':''}</div>`}

/* ---------- 確認ダイアログ(ページ内) ---------- */
function ask(msg,yes,fn){
  const d=document.createElement('div');d.className='modal';
  d.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>${msg}</p><div class="row"><button class="btn" data-y>${yes}</button><button class="btn ghost" data-n>やめる</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('[data-y]').onclick=()=>{d.remove();fn()};
  d.querySelector('[data-n]').onclick=()=>d.remove();
  d.addEventListener('keydown',e=>{if(e.key==='Escape')d.remove()});
  d.querySelector('[data-y]').focus();
}

  if(S&&S.name)document.getElementById('date').textContent=`${gradeLabel()}・${MONTHS[S.month]}${S.half?'後半':'前半'}`;
  app.innerHTML=withSide?`<div class="layout"><main class="page enter">${html}</main><aside>${side()}</aside></div>`:`<main class="page enter">${html}</main>`;
  const f=app.querySelector('[autofocus]');if(f)f.focus();
}

function wpick(a){let t=a.reduce((x,e)=>x+e[0],0),r=Math.random()*t;for(const e of a){if((r-=e[0])<0)return e}return a[a.length-1]}

  log(`ちひろに${c.first}のことを相談した。`);save();
  show(`<h2 class="hand">ちひろのアドバイス</h2><div class="speaker"><div class="ava chihiro hand" aria-hidden="true">ち</div><div class="quote hand">${esc(NN(paid?'chihiroPaid':'chihiroFree'))}</div></div>

  <div class="row"><button class="btn" onclick="plan()" autofocus>${esc(c.first)}を待つ</button><button class="btn ghost" onclick="toPick()">相手を変える</button></div>`,true)}
function rivalBroke(c,r){
  show(`<span class="stamp hand">チャンス</span><h2 class="hand">うわさ</h2><p>${esc(c.first)}が${esc(r.name)}と別れたらしい。今なら、また近づけるかもしれない。</p><div class="row"><button class="btn" onclick="plan()" autofocus>次へ</button></div>`,true)}
function confess(){
  const c=ch(S.target);
  ask(`${esc(c.first)}に告白しますか?<br>失敗すると好感度が下がり、しばらく気まずくなります。`,'告白する',doConfess);
}
function doConfess(){
  const c=ch(S.target),st=S.st[c.id],r=rv(c),wasTaken=taken(c.id);
  let p=(st.aff-45)/50;if(st.ex)p-=.2;p+=c.diff||0;p+=(S.stats[c.want]-40)/150;if(st.awk>0)p-=.15;if((S.story[c.id]||0)>=4)p+=.1;
  if(wasTaken)p=p*.3;else if(r)p-=r.prog/400;
  p=clamp(p,.03,.92);
  const ok=Math.random()<p;rc('conf');if(ok){rc('confOk');addLover(c.id)}else rc('confNg');const affAt=st.aff;const tier=affAt<45?'noLow':affAt<70?'noMid':'noHigh';
  if(ok){S.partner=c.id;st.aff=Math.min(100,st.aff+10);st.ex=false;st.awk=0;
    if(wasTaken){log(`${c.first}は${r.name}と別れ、自分を選んでくれた!`);S.rv[c.id]=null}else if(r)r.prog=15;
    log(`${c.first}に告白して、付き合うことになった!`)}
  else{st.aff=Math.max(0,st.aff-15);st.awk=3;if(r)r.prog=clamp(r.prog+10,0,100);log(`${c.first}に告白したが、振られてしまった。`)}
  save();
  show(`<h2 class="hand">告白</h2><p>${fmt(NN('confOpen').replace('{place}',NN('place')),c)}</p>
  <p>${fmt(NN(ok?'okGesture':'failGesture'),c)}</p><div class="speaker">${ava(c)}<div class="quote hand">${fmt(ok?L(c,'yes'):L(c,tier),c)}</div></div>
  ${ok&&wasTaken?`<p>${esc(c.first)}は${esc(r.name)}と別れて、あなたを選んでくれた。</p>`:''}<p class="big hand">${ok?'付き合うことになった!':'振られてしまった……'}</p>
  <p>${ok?NN('okAfter'):N.failMood[tier.slice(2).toLowerCase()]+' '+NN('failAfter')}</p><p style="color:var(--ink-soft);font-size:.9rem">${ok?'ここからは恋人としての日々が始まる。油断すると気持ちが離れたり、ライバルに奪われたりするかもしれない。':'しばらくは気まずいけれど、関係が終わったわけじゃない。別の人に目を向けてもいい。'}</p>
  <div class="row"><button class="btn" onclick="next()" autofocus>次へ</button>${ok?'':`<button class="btn ghost" onclick="toPick()">相手を変える</button>`}</div>`,true);
}
function confessed(){
  const c=ch(S.target);save();
  show(`<span class="stamp hand">事件</span><h2 class="hand">放課後、呼び出されて</h2><p>講義のあと、${esc(c.first)}に「少しだけ時間ある?」と呼び止められた。</p>
  <div class="speaker">${ava(c)}<div class="quote hand">${fmt(L(c,'conf'),c)}</div></div>
  <div class="choices"><button class="choice" onclick="answer(true)" autofocus>「うん、よろしくお願いします」</button><button class="choice" onclick="answer(false)">「ごめん、今は付き合えない」</button></div>`,true);
}
function answer(yes){
  const c=ch(S.target),st=S.st[c.id],r=rv(c);rc('confessedBy');if(yes)addLover(c.id);
  if(yes){S.partner=c.id;st.aff=Math.min(100,st.aff+8);st.ex=false;if(r)r.prog=15;log(`${c.first}から告白され、付き合うことになった!`)}
  let rp='';if(!yes){st.aff=Math.max(0,st.aff-12);st.awk=2;log(`${c.first}からの告白を断った。`);rp=ripple(c,-5,`${c.first}の告白を断った`)}
  save();
  show(`<h2 class="hand">${yes?'付き合うことになった!':'告白を断った'}</h2><p>${yes?`${esc(c.first)}はうれしそうに笑った。これからは恋人同士だ。`:`${esc(c.first)}は「そっか……うん、わかった」と、無理に笑ってみせた。`}</p>${rp}
  <div class="row"><button class="btn" onclick="plan()" autofocus>次へ</button></div>`,true);
}
function dumped(){
  const c=ch(S.target),st=S.st[c.id];rc('dumped');S.pc=null;S.sus=0;
  S.partner=null;st.ex=true;st.aff=Math.max(0,st.aff-10);st.awk=3;log(`${c.first}に別れを告げられた。`);save();
  show(`<span class="stamp hand">事件</span><h2 class="hand">話があるの</h2><p>${esc(c.first)}から「ちょっと話せる?」と連絡があった。いつもと様子が違う。</p>
  <div class="speaker">${ava(c)}<div class="quote hand">${fmt(L(c,'bye'),c)}</div></div>
  <p class="big hand">別れることになった……</p><p>それでも大学生活は続く。もう一度やり直すことも、新しい出会いを探すこともできる。</p>
  <div class="row"><button class="btn" onclick="plan()" autofocus>${esc(c.first)}を狙い続ける</button><button class="btn ghost" onclick="toPick()">相手を変える</button></div>`,true);
}
function breakUp(){
  const c=ch(S.partner);ask(`${esc(c.first)}と別れますか?`,'別れる',doBreakUp);
}
function doBreakUp(){
  const c=ch(S.partner);rc('breakup');
  S.st[c.id].ex=true;S.st[c.id].aff=Math.max(0,S.st[c.id].aff-25);S.st[c.id].awk=3;S.partner=null;log(`自分から${c.first}に別れを告げた。`);const rp=ripple(c,-5,`${c.first}を振った`);save();
  show(`<h2 class="hand">別れ</h2><p>${esc(c.first)}に別れを告げた。${esc(c.first)}は、しばらく何も言わなかった。</p>${rp}
  <div class="row"><button class="btn" onclick="toPick()" autofocus>次の相手を選ぶ</button><button class="btn ghost" onclick="plan()">このまま続ける</button></div>`,true);
}
function graduation(){
  const p=S.partner?ch(S.partner):null;
  S.gradRec=recapData();save();
  show(`<span class="stamp hand">卒業</span><h2 class="hand">卒業式</h2>
  <p>4年間の大学生活が終わった。桜の舞うキャンパスで、${esc(S.name)}は角帽を空に投げた。</p>
  ${p?`<div class="speaker">${ava(p)}<div class="quote hand">「卒業しても、ずっと一緒にいようね」</div></div><p class="big hand">${esc(p.first)}と一緒に卒業!</p>`:`<p class="big hand">恋人はいないまま卒業……</p><p>でも、出会いはまだまだこれから。</p>`}
  ${recapHtml(S.gradRec)}
  <p>ここからは卒業後の日々が続きます。</p>
  <div class="row"><button class="btn" onclick="plan()" autofocus>卒業後も続ける</button><button class="btn ghost" onclick="resetGame()">はじめからやり直す</button></div>`,true);
  document.getElementById('date').textContent='大学4年・3月 卒業式';
}
/* ---------- 大学生活の振り返り ---------- */
function recapData(){
  const r=S.rec||{},n=k=>r[k]||0;
  const p=S.partner?ch(S.partner):null;
  const best=pool().slice().sort((a,b)=>S.st[b.id].aff-S.st[a.id].aff)[0];
  const storyAll=CHARS.reduce((t,c)=>t+(S.story[c.id]||0),0);
  return {partner:p?p.id:null,paff:p?Math.round(S.st[p.id].aff):0,pstory:p?(S.story[p.id]||0):0,
    lovers:(r.lovers||[]).slice(),turns:n('turns'),loverTurns:n('loverTurns'),
    conf:n('conf'),confOk:n('confOk'),confNg:n('confNg'),confessedBy:n('confessedBy'),
    dumped:n('dumped'),twoTiming:n('twoTiming'),maxMata:n('maxMata'),breakup:n('breakup'),cheat:n('cheat'),caught:n('caught'),betrayed:n('betrayed'),stolen:n('stolen'),
    dates:n('dates'),dateNg:n('dateNg'),gifts:n('gifts'),earned:n('earned'),
    storyAll,storyFull:CHARS.filter(c=>(S.story[c.id]||0)>=4).length,
    best:best?best.id:null,bestAff:best?Math.round(S.st[best.id].aff):0,stats:Object.assign({},S.stats),money:S.money};
}
function recapTitle(d){
  const rej=d.confNg+d.dumped;
  if(d.partner&&d.paff>=90&&d.pstory>=4&&!d.cheat)return['運命の二人','恋人との絆は、もう誰にも切れない。'];
  if(d.cheat>=3&&!d.caught)return['完全犯罪','何度も浮気して、一度もバレなかった……。'];
  if(d.maxMata>=5)return['伝説の五股','5人と同時に付き合った、キャンパスの伝説。'];
  if(d.maxMata>=3)return['恋の綱渡り師','何人もの恋人と、危ない橋を渡り続けた。'];
  if(d.twoTiming)return['禁断の二股','二人を同時に愛した、危うい4年間。'];
  if(d.cheat>=3)return['キャンパスの小悪魔','スリルと修羅場に満ちた4年間だった。'];
  if(d.partner&&d.lovers.length===1&&!d.cheat)return['一途な恋人','最初に結ばれた人と、最後まで。'];
  if(d.lovers.length>=3)return['恋多き旅人','たくさんの恋を経験した4年間。'];
  if(rej>=4)return['七転び八起き','何度振られても、前を向き続けた。'];
  if(!d.lovers.length&&!d.conf)return['見守り専門','想いは胸に秘めたまま、卒業の日を迎えた。'];
  if(!d.lovers.length)return['あきらめない心','実らなかった恋も、きっと大切な思い出。'];
  if(d.partner)return['青春謳歌','恋も勉強も楽しんだ、充実の4年間。'];
  return['自由な旅人','恋を知って、またひとりで歩き出す。'];
}
function recapHtml(d){
  if(!d)return'';
  const p=d.partner?ch(d.partner):null,[tt,ts]=recapTitle(d);
  const mon=t=>t>=2?`約${Math.round(t/2)}か月`:t?'半月':'0か月';
  const cell=(k,v,sub)=>`<div class="rcell"><div class="rk">${k}</div><div class="rv">${v}</div>${sub?`<div class="rs">${sub}</div>`:''}</div>`;
  const best=d.best?ch(d.best):null;
  return `<section class="recap"><h3 class="hand">大学生活の振り返り</h3>
  <div>あなたの称号</div><div class="badge hand">${tt}</div><p>${ts}</p>
  <div class="grp">卒業時の恋人</div>
  ${p?`<div class="who">${ava(p,1)}<div><b>${esc(p.name)}</b><div class="rs" style="font-size:.85rem">ひみつストーリー ${d.pstory}/4${d.pstory>=4?'(コンプリート!)':''}</div></div></div><div style="max-width:420px;margin-top:8px">${meter(d.paff,1)}</div>`:'<p>恋人なし</p>'}
  <div class="grp">恋のデータ</div>
  <div class="rgrid">
   ${cell('付き合った人',d.lovers.length+'人')}
   ${cell('恋人がいた期間',mon(d.loverTurns),`大学生活 ${mon(d.turns)}のうち`)}
   ${cell('告白した',d.conf+'回',`成功 ${d.confOk}・失敗 ${d.confNg}`)}
   ${cell('告白された',d.confessedBy+'回')}
   ${cell('振られた',(d.confNg+d.dumped)+'回',`告白で ${d.confNg}・別れを告げられて ${d.dumped}`)}
   ${cell('自分から別れた',d.breakup+'回')}
   ${cell('浮気した',d.cheat+'回',d.cheat?`バレた ${d.caught}回`:'一度もしなかった')}
   ${cell('こっそり付き合った',(d.twoTiming||0)+'人',d.maxMata>=2?`最大 ${['','','二股','三股','四股','五股'][d.maxMata]}`:'')}
   ${cell('浮気された',d.betrayed+'回')}
   ${cell('ライバルに先を越された',d.stolen+'回')}
  </div>
  ${d.lovers.length?`<div class="rk" style="font-size:.85rem;color:var(--ink-soft)">付き合った人</div><div class="rlovers">${d.lovers.map(id=>`<span>${ava(ch(id),1)}${esc(ch(id).first)}</span>`).join('')}</div>`:''}
  <div class="grp">思い出のデータ</div>
  <div class="rgrid">
   ${cell('デート',d.dates+'回',d.dateNg?`断られた ${d.dateNg}回`:'')}
   ${cell('プレゼント',d.gifts+'回')}
   ${cell('バイト収入',yen(d.earned),`卒業時の所持金 ${yen(d.money)}`)}
   ${cell('見たひみつストーリー',d.storyAll+'話',`4話すべて見た人 ${d.storyFull}人`)}
   ${best?cell('いちばん仲良し',esc(best.first),`好感度 ${d.bestAff}`):''}
  </div>
  <div class="grp">卒業時の能力</div>
  <div style="max-width:420px">${STATS.map(k=>sbar(k,d.stats[k]||0)).join('')}</div>
  </section>`;
}
function showRecap(){
  show(`<h2 class="hand">卒業アルバム</h2>${recapHtml(S.gradRec)}<div class="row"><button class="btn" onclick="plan()" autofocus>戻る</button></div>`,true);
}
function resetGame(){ask('セーブを消して、はじめからやり直しますか?','はじめから',()=>{try{localStorage.removeItem(KEY)}catch(e){}setup()})}

/* ---------- 起動 ---------- */
function resume(){
  const saved=load();
  if(!saved||!saved.name)return setup();
  S=saved;if(S.sus==null)S.sus=0;if(S.pc===undefined)S.pc=null;S.story=S.story||{};S.hints=S.hints||{};S.rec=S.rec||{};if(S.side){S.sides=[S.side];delete S.side}S.sides=S.sides||[];CHARS.forEach(c=>{if(!S.st[c.id])S.st[c.id]={aff:rnd(8,18),awk:0,ex:false}});
  S.target?plan():toPick();
}
function titleScreen(){
  S=null;
  const saved=load(),has=!!(saved&&saved.name);
  show(`<div class="title-screen">
    <p class="tt-sub hand">〜 キャンパスで始まる、恋の物語 〜</p>
    <h2 class="tt-main hand"><span>恋愛</span><span>シミュレーション</span></h2>
    <div class="tt-ed hand">キャンパス編</div>
    <div class="tt-faces">${CHARS.filter(c=>IMG[c.id]).map(c=>`<img src="${IMG[c.id]}" alt="">`).join('')}</div>
    <p class="tt-lead">選んだ行動しだいで、付き合うことも振られることも。あなただけの大学生活を楽しもう。</p>
    <div class="row">${has?`<button class="btn tt-start" onclick="resume()" autofocus>つづきから</button><button class="btn ghost" onclick="resetGame()">はじめから</button>`:`<button class="btn tt-start" onclick="setup()" autofocus>はじめる</button>`}</div>
  </div>`);
}
titleScreen();

</script>

</html>
