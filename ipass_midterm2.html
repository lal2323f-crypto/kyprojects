<style>
/* Layout: one narrow exam-booklet column; question cards stacked, sticky score bar on top */
:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1b212b; --fg:#e7ebf2; --muted:#9aa5b8; --line:#2f3847;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.lead{color:var(--muted);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* home */
.subjects{display:flex;flex-direction:column;gap:10px}
.subj{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.subj:hover{border-color:var(--accent)}
.subj b{font-family:var(--font-display);font-size:18px;display:block}
.subj span{color:var(--muted);font-size:13px}
.subj .go{color:var(--accent);font-size:22px;font-weight:700}

/* quiz header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:none;border:none;color:var(--accent);padding:4px 0;font-weight:700}
.bar-title{font-family:var(--font-display);font-weight:700;flex:1;min-width:0}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.cheer{font-size:13px;color:var(--muted)}

/* question card */
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.q.ok{border-color:var(--ok)} .q.ng{border-color:var(--ng)}
.qno{font-family:var(--font-display);font-weight:900;color:var(--accent);font-size:14px;letter-spacing:.04em}
.qtext{margin:0}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.items li{display:grid;grid-template-columns:1.6em 1fr;gap:4px}
.blank{display:inline-block;min-width:3.4em;border:1.5px solid var(--fg);text-align:center;padding:0 6px;margin:0 2px;line-height:1.5;font-size:13px}
.formula{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
.tbl td.r{text-align:right}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:2em 1fr;gap:6px;text-align:left;background:var(--paper);

.ch:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.ch .lab{font-weight:700;color:var(--muted)}
.ch:disabled{cursor:default}
.ch.correct{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.verdict{font-weight:700;font-family:var(--font-display)}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}

.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.score{font-family:var(--font-display);font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}

.btn:disabled{opacity:.45;cursor:default}
.wronglist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wronglist li{border-left:3px solid var(--ng);padding-left:10px;font-size:14px}
.wronglist .a{color:var(--ok);font-weight:700}
.hist td.num{text-align:right}
.up{color:var(--ok);font-weight:700} .down{color:var(--ng);font-weight:700}
.reset{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.src{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}

const LABELS = ["ア","イ","ウ","エ"];
const SETS = [
  {id:"all", name:"全部", from:18, to:50},
  {id:"s1",  name:"パート1", from:18, to:27},
  {id:"s2",  name:"パート2", from:28, to:38},
  {id:"s3",  name:"パート3", from:39, to:50}
];
let cur = SETS[0];
const setQs = s => Q.filter(q => q.n >= s.from && q.n <= s.to);
const keyOf = s => "ipass_midterm2_history_" + s.id;
const $ = id => document.getElementById(id);
let deck = [], answered = 0, correct = 0, wrongs = [], fullRun = true, recorded = false;

$("subjects").innerHTML = SETS.map((s,i) => `<button class="subj" type="button" data-set="${i}">
  <div><b>${s.name}</b><span>問${s.from}〜問${s.to}（${setQs(s).length}問）</span></div><div class="go">›</div></button>`).join("");
function openSet(s){
  cur = s;
  $("barTitle").textContent = `2学期中間Iパス　${cur.name}`;
  start(setQs(cur), true);
}
$("subjects").addEventListener("click", e => {
  const b = e.target.closest(".subj"); if (!b) return;
  openSet(SETS[+b.dataset.set]);
});

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function loadHist(){ try{ return JSON.parse(localStorage.getItem(keyOf(cur))) || []; }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(keyOf(cur), JSON.stringify(h)); }catch(e){} }

function start(questions, isFull){
  fullRun = isFull; recorded = false;
  deck = shuffle(questions).map(q => {
    const order = [0,1,2,3]; // 選択肢は常に ア〜エ の固定順（問題の順番だけランダム）
    return {...q, order};
  });
  answered = 0; correct = 0; wrongs = [];
  $("home").hidden = true; $("quiz").hidden = false; $("result").hidden = true;
  render(); updateBar(); window.scrollTo(0,0);
}

function render(){
  const list = $("list"); list.innerHTML = "";
  deck.forEach((q, qi) => {
    const card = document.createElement("article");
    card.className = "q";
    let html = `<div class="qno">問${q.n}</div><p class="qtext">${esc(q.q)}</p>`;
    if (q.items) html += `<ul class="items">${q.items.map(([k,t])=>`<li><span>${k}</span><span>${esc(t)}</span></li>`).join("")}</ul>`;
    if (q.extra) html += q.extra;
    html += `<div class="choices">${q.order.map((ci,pos)=>`<button type="button" class="ch" id="q${q.n}c${ci}" data-qi="${qi}" data-ci="${ci}"><span class="lab">${LABELS[pos]}</span><span>${esc(q.c[ci])}</span></button>`).join("")}</div><div class="verdict" hidden></div>`;
    card.innerHTML = html;
    list.appendChild(card);
  });
}

$("list").addEventListener("click", e => {
  const b = e.target.closest(".ch"); if (!b || b.disabled) return;
  const q = deck[+b.dataset.qi], ci = +b.dataset.ci, card = b.closest(".q");
  card.querySelectorAll(".ch").forEach(x => x.disabled = true);
  const ok = ci === q.a;
  const right = card.querySelector(`[data-ci="${q.a}"]`);
  right.classList.add("correct");
  const rightLab = right.querySelector(".lab").textContent;
  const v = card.querySelector(".verdict"); v.hidden = false;
  if (ok){ correct++; card.classList.add("ok"); v.className="verdict ok"; v.textContent="○ 正解！"; }
  else { b.classList.add("wrong"); card.classList.add("ng"); v.className="verdict ng"; v.textContent=`× 不正解　正解は ${rightLab}`; wrongs.push(q); }
  answered++; updateBar();
  if (answered === deck.length) finish();
});

function updateBar(){
  const t = deck.length;
  $("count").textContent = `${correct} / ${answered}　（全${t}問）`;
  $("meter").style.width = (t ? answered/t*100 : 0) + "%";
  let msg = "がんばって！";
  if (answered >= 3){ const r = correct/answered; msg = r >= .9 ? "絶好調！" : r >= .7 ? "いい調子！" : r >= .5 ? "その調子でいこう" : "落ち着いて読もう"; }
  $("cheer").textContent = msg;
}

function finish(){
  $("result").hidden = false;
  const t = deck.length, pct = Math.round(correct/t*100);
  $("score").innerHTML = `${correct}／${t}<small>${pct}%</small>`;
  $("wrongBtn").disabled = wrongs.length === 0;
  $("wrongWrap").hidden = wrongs.length === 0;
  $("wrongList").innerHTML = wrongs.sort((a,b)=>a.n-b.n).map(q =>
    `<li><b>問${q.n}</b> ${esc(q.q.length>60?q.q.slice(0,60)+"…":q.q)}<br><span class="a">正解：${esc(q.c[q.a])}</span></li>`).join("");
  if (fullRun && !recorded){
    const h = loadHist(); const d = new Date();
    h.push({date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`, c:correct, t});
    saveHist(h); recorded = true;
  }
  renderHist();
}

function renderHist(){
  const h = loadHist();
  $("histBody").innerHTML = h.length ? h.map((r,i)=>{
    let diff = "—";
    if (i>0){ const dd = r.c - h[i-1].c; diff = dd>0?`<span class="up">+${dd}</span>`:dd<0?`<span class="down">${dd}</span>`:"±0"; }
    return `<tr><td class="num">${i+1}</td><td>${r.date}</td><td class="num">${r.c}／${r.t}</td><td class="num">${Math.round(r.c/r.t*100)}%</td><td class="num">${diff}</td></tr>`;
  }).join("") : `<tr><td colspan="5" style="color:var(--muted)">まだ記録がありません（全問通しで解くと記録されます）</td></tr>`;
}

$("backBtn").onclick = () => { $("quiz").hidden = true; $("home").hidden = false; window.scrollTo(0,0); };
$("shuffleBtn").onclick = () => start(setQs(cur), true);
$("wrongBtn").onclick = () => start(wrongs.slice(), false);
function askReset(){
  $("resetArea").innerHTML = `<div class="confirm">記録を全て消しますか？ <button class="reset" id="yesReset" type="button">消す</button><button class="reset" id="noReset" type="button">やめる</button></div>`;
  $("yesReset").onclick = () => { saveHist([]); renderHist(); restoreReset(); };
  $("noReset").onclick = restoreReset;
}
function restoreReset(){
  $("resetArea").innerHTML = `<button class="reset" id="resetBtn" type="button">記録をリセット</button>`;
  $("resetBtn").onclick = askReset;
}
$("resetBtn").onclick = askReset;
// ?set=s1 などが付いていればそのパートから。無ければ科目選択の画面
const urlSet = SETS.find(s => s.id === new URLSearchParams(location.search).get("set"));
if (urlSet) openSet(urlSet);
</script>
